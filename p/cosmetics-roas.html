<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>지표 2 — ROAS 비교, 음식물 소구 vs 화장품 소구 | 박성진</title>
<meta name="description" content="신규 고객 180일 LTV 기준 ROAS 비교. 광고비 회수선 100%를 기준으로 두 소구의 회수 여부를 확인">
<link rel="stylesheet" href="../assets/style.css">
<style>
  .chartcard{padding:24px 22px 16px}
  .chart-t{font-size:16px;font-weight:800;color:var(--ink);text-align:center;margin-bottom:3px}
  .chart-t .dl{color:var(--green)}
  .chart-s{font-size:12.5px;color:var(--ink-3);text-align:center;margin-bottom:16px}
  .cvs{width:100%;height:auto;display:block;max-width:720px;margin:0 auto}
</style>
</head><body><div class="wrap">



<div class="card chartcard">
  <div class="chart-t">ROAS 비교 <span class="dl">(+130.1%p)</span></div>
  <div class="chart-s">신규 고객 180일 LTV 기준 · 100% = 광고비 회수선</div>
  <svg class="cvs" viewBox="0 0 620 380" role="img"
       aria-label="LTV 기준 ROAS 비교. 음식물 소구 99.3퍼센트로 회수선 미달, 화장품 소구 229.4퍼센트.">
    <g font-size="12" fill="#7A8294" font-family="Pretendard, sans-serif">
      <text x="60" y="324" text-anchor="end">0%</text>
      <text x="60" y="268" text-anchor="end">50%</text>
      <text x="60" y="212" text-anchor="end">100%</text>
      <text x="60" y="156" text-anchor="end">150%</text>
      <text x="60" y="100" text-anchor="end">200%</text>
      <text x="60" y="44"  text-anchor="end">250%</text>
    </g>
    <g stroke="#E6E9EF" stroke-width="1">
      <line x1="70" y1="320" x2="600" y2="320"/>
      <line x1="70" y1="264" x2="600" y2="264"/>
      <line x1="70" y1="152" x2="600" y2="152"/>
      <line x1="70" y1="96"  x2="600" y2="96"/>
      <line x1="70" y1="40"  x2="600" y2="40"/>
    </g>
    <rect x="145" y="209" width="130" height="111" rx="4" fill="#EF4444" opacity=".82"/>
    <rect x="395" y="63"  width="130" height="257" rx="4" fill="#10B981" opacity=".9"/>
    <line x1="70" y1="208" x2="600" y2="208" stroke="#F59E0B" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="596" y="200" font-size="12" font-weight="700" fill="#B26A02"
          text-anchor="end" font-family="Pretendard, sans-serif">광고비 회수선 100%</text>
    <g font-family="Pretendard, sans-serif" font-weight="800" font-size="19" text-anchor="middle">
      <text x="210" y="198" fill="#B91C1C">99.3%</text>
      <text x="460" y="52"  fill="#0B7A5B">229.4%</text>
    </g>
    <g font-family="Pretendard, sans-serif" font-size="13.5" fill="#3A4254" text-anchor="middle">
      <text x="210" y="346">음식물 소구</text>
      <text x="210" y="364" font-size="11.5" fill="#7A8294">여름철 · 25.06</text>
      <text x="460" y="346" font-weight="700">화장품 소구</text>
      <text x="460" y="364" font-size="11.5" fill="#7A8294">방치 · 25.05</text>
    </g>
    <line x1="70" y1="320" x2="600" y2="320" stroke="#3A4254" stroke-width="1.5"/>
  </svg>
</div>

</div></body></html>
