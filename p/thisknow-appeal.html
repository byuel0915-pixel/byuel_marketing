<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>이거알아 — 소구 3종 비교 | 박성진</title>
<meta name="description" content="같은 자막 반복 포맷에 소구만 3종으로 나눠 집행한 결과. 반복이 통하는 소구와 통하지 않는 소구">
<link rel="stylesheet" href="../assets/style.css">
<style>
  .wrap{padding:14px 16px}
  .ct{display:flex;align-items:baseline;justify-content:space-between;gap:9px;margin-bottom:4px}
  .ct h3{margin:0;font-size:15px;font-weight:800;letter-spacing:-.015em}
  .ct .dir{font-size:11px;font-weight:700;color:var(--ink-3);white-space:nowrap}
  .grp{margin:0 0 16px}
  .bar-row{grid-template-columns:66px 1fr;gap:10px;margin:6px 0}
  .bar-row .name{font-size:12px}
  .bar-track{height:28px}
  .bar-fill{font-size:12.5px;padding-right:10px}
  .lead{display:flex;align-items:center;gap:8px;margin-bottom:14px;padding:9px 12px;
    background:var(--blue-soft);border-radius:9px;font-size:13px;font-weight:700;color:var(--blue)}
  .lead .tag{font-size:11px;font-weight:800;background:var(--blue);color:#fff;padding:2px 8px;border-radius:5px}
  .note{margin-top:12px}
  @media(max-width:520px){.bar-row{grid-template-columns:56px 1fr;gap:7px}.bar-row .name{font-size:10.5px}.ct{flex-direction:column;align-items:flex-start;gap:2px}}
</style>
</head><body><div class="wrap">
<div class="card pad chart">

  <div class="lead"><span class="tag">추가 발견</span>반복 포맷은 소구를 가립니다</div>

  <div class="grp">
    <div class="ct"></div>
    <div class="bar-row"><div class="name">반찬통</div><div class="bar-track"><div class="bar-fill bf-green" style="width:100%">6초</div></div></div>
    <div class="bar-row"><div class="name">배달음식</div><div class="bar-track"><div class="bar-fill bf-red" style="width:33.3%">2초</div></div></div>
    <div class="bar-row"><div class="name">폐기물</div><div class="bar-track"><div class="bar-fill bf-red" style="width:33.3%">2초</div></div></div>
  </div>

  <div class="grp">
    <div class="ct"><h3>예산 비중</h3><span class="dir">세트 예산 100% 기준 · 매체 자동 배분</span></div>
    <div class="bar-row"><div class="name">반찬통</div><div class="bar-track"><div class="bar-fill bf-green" style="width:100%">77.6%</div></div></div>
    <div class="bar-row"><div class="name">배달음식</div><div class="bar-track"><div class="bar-fill bf-gray" style="width:19.2%">14.9%</div></div></div>
    <div class="bar-row"><div class="name">폐기물</div><div class="bar-track"><div class="bar-fill bf-gray" style="width:9.7%">7.5%</div></div></div>
  </div>

  <div class="grp">
    <div class="ct"><h3>CTR — 순서가 다릅니다</h3><span class="dir">높을수록 좋음</span></div>
    <div class="bar-row"><div class="name">폐기물</div><div class="bar-track"><div class="bar-fill bf-blue" style="width:100%">1.84%</div></div></div>
    <div class="bar-row"><div class="name">반찬통</div><div class="bar-track"><div class="bar-fill bf-blue" style="width:95.7%">1.76%</div></div></div>
    <div class="bar-row"><div class="name">배달음식</div><div class="bar-track"><div class="bar-fill bf-gray" style="width:60.3%">1.11%</div></div></div>
  </div>
</div>
</div></body></html>
