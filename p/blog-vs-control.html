<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>블로그 랜딩 세트 vs 앱홍보 대조군 | 박성진</title>
<meta name="description" content="고효율소재모음 세트(26.07.08 라이브)와 앱홍보 구매 캠페인의 구매 CPA·설치→구매 전환율 비교">
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="../assets/chart.css">
<style>
.wrap{padding:12px 14px}
.gx{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mp{border:1px solid var(--line,#E8E8E6);border-radius:11px;padding:11px 12px 13px}
.mt{font-size:12.5px;font-weight:800;letter-spacing:-.01em;margin:0 0 2px}
.ms{font-size:10.5px;font-weight:600;color:var(--ink-3);margin:0 0 12px}
.gp{margin-bottom:13px}
.gp:last-child{margin-bottom:0}
.gl{font-size:11px;font-weight:800;color:var(--ink-2);margin:0 0 5px}
.rw{display:grid;grid-template-columns:74px 1fr;gap:8px;align-items:center;margin-bottom:5px}
.nm{font-size:10.5px;font-weight:700;color:var(--ink-3)}
.tr{position:relative;height:17px;background:#F4F4F2;border-radius:4px;overflow:hidden}
.bar{position:absolute;left:0;top:0;height:100%;border-radius:4px}
.bk{background:#9AA0AA}.br{background:#DC2626}.bg{background:#16A34A}.bo{background:#F59E0B}
.vl{position:absolute;right:6px;top:0;line-height:17px;font-size:10.5px;font-weight:800;color:#1A1A18;font-feature-settings:'tnum'}
.vl.on{color:#fff}
.dl{font-size:10.5px;font-weight:800;margin-top:2px;font-feature-settings:'tnum'}
.dl.up{color:#DC2626}.dl.dn{color:#16A34A}.dl.eq{color:#8A8F98}
@media(max-width:660px){.gx{grid-template-columns:1fr;gap:10px}}
</style>
</head><body><div class="wrap">
<div class="card pad chart">
  <div class="gx">

    <div class="mp">
      <p class="mt">구매 CPA — 대조군을 100으로</p><p class="ms">낮을수록 좋음 · 라이브 직후 21% 열위에서 동률까지</p>

      <div class="gp"><p class="gl">7월 (라이브 직후)</p>
        <div class="rw"><span class="nm">블로그 세트</span>
          <div class="tr"><i class="bar br" style="width:100%"></i><span class="vl on">121</span></div></div>
        <div class="rw"><span class="nm">앱홍보 대조군</span>
          <div class="tr"><i class="bar bk" style="width:82.6%"></i><span class="vl on">100</span></div></div>
        <p class="dl up">21% 열위</p></div>

      <div class="gp"><p class="gl">8월</p>
        <div class="rw"><span class="nm">블로그 세트</span>
          <div class="tr"><i class="bar bo" style="width:85.1%"></i><span class="vl on">103</span></div></div>
        <div class="rw"><span class="nm">앱홍보 대조군</span>
          <div class="tr"><i class="bar bk" style="width:82.6%"></i><span class="vl on">100</span></div></div>
        <p class="dl eq">+3.3% · 사실상 동률</p></div>
    </div>

    <div class="mp">
      <p class="mt">설치 → 구매 전환율</p><p class="ms">높을수록 좋음 · 이 실험이 이긴 지표</p>

      <div class="gp"><p class="gl">7월 (라이브 직후)</p>
        <div class="rw"><span class="nm">블로그 세트</span>
          <div class="tr"><i class="bar br" style="width:30.4%"></i><span class="vl">18.7%</span></div></div>
        <div class="rw"><span class="nm">앱홍보 대조군</span>
          <div class="tr"><i class="bar bk" style="width:38.2%"></i><span class="vl">23.5%</span></div></div>
        <p class="dl up">−4.8%p 열위</p></div>

      <div class="gp"><p class="gl">8월</p>
        <div class="rw"><span class="nm">블로그 세트</span>
          <div class="tr"><i class="bar bg" style="width:100%"></i><span class="vl on">61.5%</span></div></div>
        <div class="rw"><span class="nm">앱홍보 대조군</span>
          <div class="tr"><i class="bar bk" style="width:45.9%"></i><span class="vl">28.2%</span></div></div>
        <p class="dl dn">2.2배 · 표본 39설치</p></div>
    </div>

  </div>
</div>
</div></body></html>
