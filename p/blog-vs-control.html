<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>블로그 랜딩 세트 vs 앱홍보 대조군 — 4단 퍼널 | 박성진</title>
<meta name="description" content="고효율소재모음 세트(26.07.08~08.25)와 앱홍보 구매 캠페인의 링크클릭·클릭→설치·설치→구매·클릭→구매 비교">
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="../assets/chart.css">
<style>
.wrap{padding:12px 14px}
.lgd{display:flex;gap:15px;margin:0 0 12px;font-size:10.5px;font-weight:700;color:var(--ink-2)}
.lgd i{display:inline-block;width:11px;height:8px;border-radius:2px;margin-right:5px}
.bb{background:#2563EB}.bk{background:#9AA0AA}
.gp{border:1px solid var(--line,#E8E8E6);border-radius:11px;padding:10px 12px 11px;margin-bottom:9px}
.gp:last-child{margin-bottom:0}
.gh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 0 7px}
.gt{font-size:12px;font-weight:800;letter-spacing:-.01em}
.gv{font-size:11.5px;font-weight:800;font-feature-settings:'tnum'}
.gv.win{color:#16A34A}.gv.lose{color:#DC2626}.gv.eq{color:#8A8F98}
.rw{display:grid;grid-template-columns:78px 1fr;gap:8px;align-items:center;margin-bottom:4px}
.rw:last-child{margin-bottom:0}
.nm{font-size:10px;font-weight:700;color:var(--ink-3)}
.tr{position:relative;height:15px;background:#F4F4F2;border-radius:4px;overflow:hidden}
.bar{position:absolute;left:0;top:0;height:100%;border-radius:4px}
.vl{position:absolute;right:6px;top:0;line-height:15px;font-size:10px;font-weight:800;color:#1A1A18;font-feature-settings:'tnum'}
.vl.on{color:#fff}
</style>
</head><body><div class="wrap">
<div class="card pad chart">
  <div class="lgd"><span><i class="bb"></i>블로그 랜딩 세트</span><span><i class="bk"></i>앱홍보 대조군</span></div>

  <div class="gp">
    <div class="gh"><span class="gt">① 광고 → 링크 클릭</span><span class="gv win">1.58배 우위</span></div>
    <div class="rw"><span class="nm">블로그</span><div class="tr"><i class="bar bb" style="width:100%"></i><span class="vl on">1.10%</span></div></div>
    <div class="rw"><span class="nm">대조군</span><div class="tr"><i class="bar bk" style="width:63.4%"></i><span class="vl on">0.70%</span></div></div>
  </div>

  <div class="gp">
    <div class="gh"><span class="gt">② 클릭당 비용</span><span class="gv win">2.75배 저렴</span></div>
    <div class="rw"><span class="nm">블로그</span><div class="tr"><i class="bar bb" style="width:36.3%"></i><span class="vl">36</span></div></div>
    <div class="rw"><span class="nm">대조군</span><div class="tr"><i class="bar bk" style="width:100%"></i><span class="vl on">100</span></div></div>
  </div>

  <div class="gp">
    <div class="gh"><span class="gt">③ 링크 클릭 → 설치</span><span class="gv lose">0.29배 열위</span></div>
    <div class="rw"><span class="nm">블로그</span><div class="tr"><i class="bar bb" style="width:29.3%"></i><span class="vl">5.0%</span></div></div>
    <div class="rw"><span class="nm">대조군</span><div class="tr"><i class="bar bk" style="width:100%"></i><span class="vl on">17.1%</span></div></div>
  </div>

  <div class="gp">
    <div class="gh"><span class="gt">④ 설치 → 구매 (8월)</span><span class="gv win">2.18배 우위</span></div>
    <div class="rw"><span class="nm">블로그</span><div class="tr"><i class="bar bb" style="width:100%"></i><span class="vl on">61.5%</span></div></div>
    <div class="rw"><span class="nm">대조군</span><div class="tr"><i class="bar bk" style="width:45.9%"></i><span class="vl on">28.2%</span></div></div>
  </div>

  <div class="gp">
    <div class="gh"><span class="gt">최종 · 클릭 → 구매</span><span class="gv lose">0.27배 열위</span></div>
    <div class="rw"><span class="nm">블로그</span><div class="tr"><i class="bar bb" style="width:26.6%"></i><span class="vl">1.04%</span></div></div>
    <div class="rw"><span class="nm">대조군</span><div class="tr"><i class="bar bk" style="width:100%"></i><span class="vl on">3.92%</span></div></div>
  </div>

  <div class="gp">
    <div class="gh"><span class="gt">결과 · 구매 CPA (8월)</span><span class="gv eq">+3.3% 동률</span></div>
    <div class="rw"><span class="nm">블로그</span><div class="tr"><i class="bar bb" style="width:100%"></i><span class="vl on">103</span></div></div>
    <div class="rw"><span class="nm">대조군</span><div class="tr"><i class="bar bk" style="width:97%"></i><span class="vl on">100</span></div></div>
  </div>

</div>
</div></body></html>
