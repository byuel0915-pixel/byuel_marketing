<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>블로그 후기 랜딩 vs 앱홍보 대조군 | 박성진</title>
<meta name="description" content="블로그 후기 랜딩 세트와 앱홍보 구매 캠페인의 링크 클릭률·설치→구매 전환율·구매 CPA 비교 (26.07.08~08.25)">
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="../assets/chart.css">
<style>
.wrap{padding:12px 14px}
.lgd{display:flex;gap:15px;margin:0 0 12px;font-size:11px;font-weight:700;color:var(--ink-2)}
.lgd i{display:inline-block;width:12px;height:9px;border-radius:2px;margin-right:5px}
.bb{background:#2563EB}.bk{background:#9AA0AA}
.gp{border:1px solid var(--line,#E8E8E6);border-radius:11px;padding:12px 13px 13px;margin-bottom:10px}
.gp:last-child{margin-bottom:0}
.gh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 0 9px}
.gt{font-size:13px;font-weight:800;letter-spacing:-.01em}
.gs{display:block;font-size:10.5px;font-weight:600;color:var(--ink-3);margin-top:2px}
.gv{font-size:13px;font-weight:900;font-feature-settings:'tnum';white-space:nowrap}
.gv.win{color:#16A34A}.gv.eq{color:#8A8F98}
.rw{display:grid;grid-template-columns:86px 1fr;gap:9px;align-items:center;margin-bottom:5px}
.rw:last-child{margin-bottom:0}
.nm{font-size:10.5px;font-weight:700;color:var(--ink-3)}
.tr{position:relative;height:20px;background:#F4F4F2;border-radius:4px;overflow:hidden}
.bar{position:absolute;left:0;top:0;height:100%;border-radius:4px}
.vl{position:absolute;right:7px;top:0;line-height:20px;font-size:11.5px;font-weight:800;color:#1A1A18;font-feature-settings:'tnum'}
.vl.on{color:#fff}
</style>
</head><body><div class="wrap">
<div class="card pad chart">
  <div class="lgd"><span><i class="bb"></i>블로그 후기 랜딩</span><span><i class="bk"></i>앱홍보 대조군</span></div>

  <div class="gp">
    <div class="gh"><span class="gt">광고 → 링크 클릭률<span class="gs">CTA를 '후기 확인 + 쿠폰'으로 바꾼 구간</span></span><span class="gv win">1.58배</span></div>
    <div class="rw"><span class="nm">블로그 후기</span><div class="tr"><i class="bar bb" style="width:100%"></i><span class="vl on">1.10%</span></div></div>
    <div class="rw"><span class="nm">앱홍보 대조군</span><div class="tr"><i class="bar bk" style="width:63.4%"></i><span class="vl on">0.70%</span></div></div>
  </div>

  <div class="gp">
    <div class="gh"><span class="gt">설치 → 구매 전환율<span class="gs">설치자를 추적한 코호트 기준</span></span><span class="gv win">+3.8%p</span></div>
    <div class="rw"><span class="nm">블로그 후기</span><div class="tr"><i class="bar bb" style="width:100%"></i><span class="vl on">23.1%</span></div></div>
    <div class="rw"><span class="nm">앱홍보 대조군</span><div class="tr"><i class="bar bk" style="width:83.5%"></i><span class="vl on">19.3%</span></div></div>
  </div>

  <div class="gp">
    <div class="gh"><span class="gt">구매 CPA<span class="gs">대조군을 100으로 · 낮을수록 저렴</span></span><span class="gv eq">동률</span></div>
    <div class="rw"><span class="nm">블로그 후기</span><div class="tr"><i class="bar bb" style="width:100%"></i><span class="vl on">103</span></div></div>
    <div class="rw"><span class="nm">앱홍보 대조군</span><div class="tr"><i class="bar bk" style="width:97%"></i><span class="vl on">100</span></div></div>
  </div>

</div>
</div></body></html>
