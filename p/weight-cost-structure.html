<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>무게 허들 상향 — 재원 구조 | 박성진</title>
<meta name="description" content="혜택 대상을 줄이고 단가를 키운 재원 재배치 구조 비교">
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="../assets/chart.css">
<style>
.wrap{padding:12px 14px}
.hd h3{margin:0;font-size:15px;font-weight:800;letter-spacing:-.02em}
.hd .dir{display:block;font-size:11px;font-weight:600;color:var(--ink-3);margin-top:2px}
.lgd{display:flex;gap:14px;margin:10px 0 2px;font-size:11px;font-weight:700;color:var(--ink-2);flex-wrap:wrap}
.lgd i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.gx{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:12px 0 4px}
.mp{border:1px solid var(--line,#E8E8E6);border-radius:11px;padding:10px 11px 12px}
.mt{font-size:12px;font-weight:800;letter-spacing:-.01em;margin:0 0 2px}
.ms{font-size:10.5px;font-weight:600;color:var(--ink-3);margin:0 0 10px;line-height:1.45;min-height:30px}
.rw{margin-bottom:9px}
.lb{font-size:10.5px;font-weight:700;color:var(--ink-2);display:block;margin-bottom:3px}
.tr{position:relative;height:20px;background:#F4F4F2;border-radius:4px;overflow:hidden}
.bar{position:absolute;left:0;top:0;height:100%;border-radius:4px}
.bk{background:#C9CCD3}.bg{background:#16A34A}.br{background:#DC2626}.bn{background:#9AA0AA}
.vl{position:absolute;right:7px;top:0;line-height:20px;font-size:11px;font-weight:800;color:#1A1A18;font-feature-settings:'tnum'}
.vl.on{color:#fff}
.dl{font-size:11px;font-weight:800;margin-top:5px;font-feature-settings:'tnum'}
.dl.g{color:#16A34A}.dl.r{color:#DC2626}.dl.n{color:var(--ink-3)}
.ft{margin-top:12px;font-size:11.5px;font-weight:600;color:var(--ink-3);line-height:1.65}
@media(max-width:760px){.gx{grid-template-columns:1fr;gap:9px}}
</style>
</head><body><div class="wrap">
<div class="card pad chart">
  
  <div class="lgd"><span><i class="bk"></i>프로모션 전 (8kg 초과 · 500원)</span><span><i class="bg"></i>프로모션 중 (12kg 초과 · 1,000원)</span></div>
  <div class="gx">
    <div class="mp">
      <p class="mt">① 1인당 할인 단가</p><p class="ms">받는 사람 입장에서 본 혜택 크기</p>
      <div class="rw"><span class="lb">프로모션 전</span><div class="tr"><i class="bar bk" style="width:50%"></i><span class="vl">500원</span></div></div>
      <div class="rw"><span class="lb">프로모션 중</span><div class="tr"><i class="bar bg" style="width:100%"></i><span class="vl on">1,000원</span></div></div>
      <p class="dl g">2배</p>
    </div>
    <div class="mp">
      <p class="mt">② 혜택 대상 유저 비중</p><p class="ms">할인을 받는 사람의 비율</p>
      <div class="rw"><span class="lb">프로모션 전</span><div class="tr"><i class="bar bk" style="width:100%"></i><span class="vl">31.72%</span></div></div>
      <div class="rw"><span class="lb">프로모션 중</span><div class="tr"><i class="bar bn" style="width:55.4%"></i><span class="vl">17.56%</span></div></div>
      <p class="dl n">−14.16%p · 절반으로 축소</p>
    </div>
    <div class="mp">
      <p class="mt">③ 주문당 할인 원가</p><p class="ms">회사가 실제로 쓴 돈 · 지수</p>
      <div class="rw"><span class="lb">프로모션 전</span><div class="tr"><i class="bar bk" style="width:90.3%"></i><span class="vl">100</span></div></div>
      <div class="rw"><span class="lb">프로모션 중</span><div class="tr"><i class="bar bn" style="width:100%"></i><span class="vl on">110.7</span></div></div>
      <p class="dl n">+10.7% · 사실상 동결</p>
    </div>
  </div>
</div>
</div></body></html>
