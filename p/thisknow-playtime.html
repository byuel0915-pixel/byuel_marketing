<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>이거알아 — 평균 재생 시간 | 박성진</title>
<meta name="description" content="자막 반복형 리타겟 소재의 평균 재생 시간을 기존 세트와 비교">
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="../assets/chart.css">
<style>
.wrap{padding:10px 12px}
.hd h3{margin:0;font-size:14px;font-weight:800;letter-spacing:-.02em}
.hd .dir{display:block;font-size:10.5px;font-weight:600;color:var(--ink-3);margin-top:2px}
.gx{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:11px 0 2px}
.os{font-size:10.5px;font-weight:800;color:var(--ink-3);margin:0 0 5px}
.rw{display:grid;grid-template-columns:52px 1fr;align-items:center;gap:7px;margin-bottom:5px}
.lb{font-size:10.5px;font-weight:700;color:var(--ink-2)}
.tr{position:relative;height:20px;background:#F4F4F2;border-radius:4px;overflow:hidden}
.bar{position:absolute;left:0;top:0;height:100%;border-radius:4px}
.k{background:#D6D6D2}.g{background:var(--green,#16A34A)}.r{background:var(--red,#DC2626)}
.vl{position:absolute;right:7px;top:0;line-height:20px;font-size:11px;font-weight:800;color:#1A1A18;font-feature-settings:'tnum'}
.vl.on{color:#fff}
.dl{font-size:11.5px;font-weight:800;margin-top:5px;font-feature-settings:'tnum'}
.dl.g{color:var(--green,#16A34A)}.dl.r{color:var(--red,#DC2626)}
@media(max-width:520px){.gx{grid-template-columns:1fr;gap:10px}}
</style>
</head><body><div class="wrap">
<div class="card pad chart">
  
  <div class="gx">
    <div>
      <p class="os">iOS</p>
      <div class="rw"><span class="lb">기존</span><div class="tr"><i class="bar k" style="width:57.4%"></i><span class="vl">2.7초</span></div></div>
      <div class="rw"><span class="lb">이거알아</span><div class="tr"><i class="bar g" style="width:100%"></i><span class="vl on">4.7초</span></div></div>
      <p class="dl g">1.77배</p>
    </div>
    <div>
      <p class="os">AOS</p>
      <div class="rw"><span class="lb">기존</span><div class="tr"><i class="bar k" style="width:87.1%"></i><span class="vl">5.4초</span></div></div>
      <div class="rw"><span class="lb">이거알아</span><div class="tr"><i class="bar g" style="width:100%"></i><span class="vl on">6.2초</span></div></div>
      <p class="dl g">1.15배</p>
    </div>
  </div>
</div>
</div></body></html>
