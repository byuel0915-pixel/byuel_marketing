<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>참여 캠페인 리드 퍼널 — 상세페이지 · 알림톡 | 박성진</title>
<meta name="description" content="참여 캠페인으로 연락처를 모아 알림톡 쿠폰으로 구매를 만든 퍼널의 상세페이지와 실제 알림톡">
<link rel="stylesheet" href="../assets/style.css">
<style>
.dp-wrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:820px){.dp-wrap{grid-template-columns:1fr}}
.dp-frame{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px;box-shadow:var(--shadow)}
.dp-lab{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--blue,#2563EB);margin:0 0 8px 2px}
.fig{position:relative;width:100%;height:600px;border-radius:12px;overflow:hidden;background:#0B1020}
.fig .sc{width:100%;height:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.fig .sc img{width:100%;height:auto;display:block}
.fig .fade{position:absolute;left:0;right:0;bottom:0;height:44px;pointer-events:none;
  background:linear-gradient(180deg,rgba(11,16,32,0),rgba(11,16,32,.55))}
.fig .cue{position:absolute;left:50%;bottom:9px;transform:translateX(-50%);pointer-events:none;
  font-size:10.5px;font-weight:800;color:#fff;background:rgba(17,24,39,.66);
  border-radius:999px;padding:3px 10px;letter-spacing:.01em}
.dp-hint{font-size:11.5px;color:var(--ink-3);font-weight:600;text-align:center;margin:9px 0 2px}
.dp-hint a{color:var(--blue,#2563EB);font-weight:800}
.shot{width:100%;height:auto;display:block;border-radius:12px;border:1px solid var(--line)}
.dp-steps{display:flex;flex-direction:column;gap:11px;margin-top:14px}
.dp-step{display:flex;gap:11px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 15px}
.dp-num{flex:0 0 25px;height:25px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;background:#2563EB}
.dp-step h3{margin:0 0 3px;font-size:13.5px;font-weight:800;color:var(--ink)}
.dp-step p{margin:0;font-size:12.5px;line-height:1.6;color:var(--ink-2)}
</style>
