<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>990원 vs 클린스마스 — 유입·CAC·전환율 | 박성진</title>
<meta name="description" content="2024.12 990원 진입 이벤트와 2025.12 클린스마스 50% 반값 프로모션을 유입·CAC·전환율 세 지표로 비교">
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="../assets/chart.css">
<style>
.wrap{padding:12px 14px}
.hd h3{margin:0;font-size:15px;font-weight:800;letter-spacing:-.02em}
.hd .dir{display:block;font-size:11px;font-weight:600;color:var(--ink-3);margin-top:2px}
.lgd{display:flex;gap:14px;margin:10px 0 2px;font-size:11px;font-weight:700;color:var(--ink-2)}
.lgd i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.gx{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:12px 0 4px}
.mp{border:1px solid var(--line,#E8E8E6);border-radius:11px;padding:10px 11px 12px}
.mt{font-size:12px;font-weight:800;letter-spacing:-.01em;margin:0 0 2px}
.ms{font-size:10.5px;font-weight:600;color:var(--ink-3);margin:0 0 10px}
.rw{margin-bottom:9px}
.lb{font-size:10.5px;font-weight:700;color:var(--ink-2);display:block;margin-bottom:3px}
.tr{position:relative;height:19px;background:#F4F4F2;border-radius:4px;overflow:hidden}
.bar{position:absolute;left:0;top:0;height:100%;border-radius:4px}
.b990{background:#C9CCD3}.bxm{background:#16A34A}.bbad{background:#DC2626}
.vl{position:absolute;right:6px;top:0;line-height:19px;font-size:11px;font-weight:800;color:#1A1A18;font-feature-settings:'tnum'}
.vl.on{color:#fff}
@media(max-width:640px){.gx{grid-template-columns:1fr;gap:9px}}
</style>
</head><body><div class="wrap">
<div class="card pad chart">

  

  <div class="lgd">
    <span><i class="b990"></i>990원 (24.12)</span>
    <span><i class="bxm"></i>클린스마스 (25.12)</span>
  </div>

  <div class="gx">

    <div class="mp">
      <p class="mt">① 유입</p><p class="ms">신규 유저(D30) 증가율 · 높을수록 좋음</p>
      <div class="rw"><span class="lb">990원</span><div class="tr"><i class="bar b990" style="width:55.5%"></i><span class="vl">+34.0%</span></div></div>
      <div class="rw"><span class="lb">클린스마스</span><div class="tr"><i class="bar bxm" style="width:100%"></i><span class="vl on">+61.3%</span></div></div>
    </div>

    <div class="mp">
      <p class="mt">② CAC</p><p class="ms">신규 1명당 획득비 변화 · 낮을수록 좋음</p>
      <div class="rw"><span class="lb">990원</span><div class="tr"><i class="bar bbad" style="width:100%"></i><span class="vl on">+9.6%</span></div></div>
      <div class="rw"><span class="lb">클린스마스</span><div class="tr"><i class="bar bxm" style="width:17%"></i><span class="vl">−1.6%</span></div></div>
    </div>

    <div class="mp">
      <p class="mt">③ 전환율</p><p class="ms">가입 후 30일 내 첫 이용 · 높을수록 좋음</p>
      <div class="rw"><span class="lb">990원</span><div class="tr"><i class="bar b990" style="width:45.6%"></i><span class="vl">17.6%</span></div></div>
      <div class="rw"><span class="lb">클린스마스</span><div class="tr"><i class="bar bxm" style="width:100%"></i><span class="vl on">38.6%</span></div></div>
    </div>

  </div>
</div>
</div></body></html>
