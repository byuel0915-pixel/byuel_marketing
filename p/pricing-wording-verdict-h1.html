<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>요금 워딩 A/B — 가설 1 (단기) 검증 결과 | 박성진</title>
<meta name="description" content="'방문요금 0원'이 구매 CVR·CAC에서 앞설 것이라는 가설 1을 검증한 결과">
<link rel="stylesheet" href="../assets/style.css">
<style>
  .wrap{padding:10px 12px}
  .card.pad{padding:14px 16px}
  .verdict{display:flex;align-items:center;gap:8px;margin-bottom:9px;padding:7px 11px;
    background:var(--red-soft);border-radius:9px;font-size:12.5px;font-weight:700;color:var(--red);line-height:1.35}
  .verdict .tag{font-size:10.5px;font-weight:800;background:var(--red);color:#fff;padding:2px 7px;border-radius:5px;white-space:nowrap}
  .hyp{font-size:12px;color:var(--ink-2);border-left:3px solid var(--line);padding-left:10px;margin:0 0 11px;line-height:1.5}
  .hyp .sub{color:var(--ink-3);font-size:11px}
  .mets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 14px}
  .grp{margin:0}
  .ct{margin-bottom:5px}
  .ct h3{margin:0;font-size:12.5px;font-weight:800;letter-spacing:-.015em;line-height:1.3}
  .ct .dir{display:block;font-size:10px;font-weight:700;color:var(--ink-3);line-height:1.3;margin-top:1px}
  .bar-row{grid-template-columns:50px 1fr;gap:7px;margin:4px 0}
  .bar-row .name{font-size:10.5px}
  .bar-track{height:22px;border-radius:6px;overflow:visible}
  .bar-fill{font-size:11px;padding-right:7px;border-radius:6px}
  /* 막대가 너무 짧아 숫자가 잘리는 경우 라벨을 막대 밖으로 */
  .bar-fill.out{justify-content:flex-start;padding-right:0}
  .bar-fill.out span{position:absolute;left:100%;margin-left:6px;white-space:nowrap;
    font-size:11px;font-weight:800;color:var(--red)}
  .note{margin-top:10px;font-size:11.5px;line-height:1.55}
  @media(max-width:640px){
    .mets{grid-template-columns:1fr;gap:11px}
    .bar-row{grid-template-columns:56px 1fr}
  }
</style>
</head><body><div class="wrap">
<div class="card pad chart">

  <div class="verdict"><span class="tag">가설 1 기각</span>단기 지표에서 '기본요금'이 이겼습니다 — 예측과 반대</div>

  <div class="mets">
    <div class="grp">
      <div class="ct"></div>
      <div class="bar-row"><div class="name">기본요금</div><div class="bar-track"><div class="bar-fill bf-green" style="width:74.8%">기준</div></div></div>
      <div class="bar-row"><div class="name">방문요금</div><div class="bar-track"><div class="bar-fill bf-red" style="width:100%">+33.6%</div></div></div>
    </div>

    <div class="grp">
      <div class="ct"><h3>② 구매 건수</h3><span class="dir">광고비 거의 동일 · 상대 비교</span></div>
      <div class="bar-row"><div class="name">기본요금</div><div class="bar-track"><div class="bar-fill bf-green" style="width:100%">1.46배</div></div></div>
      <div class="bar-row"><div class="name">방문요금</div><div class="bar-track"><div class="bar-fill bf-red" style="width:68.5%">기준</div></div></div>
    </div>

    <div class="grp">
      <div class="ct"><h3>③ 계정 평균 대비 CPA</h3><span class="dir">계정 전체 평균 = 0%</span></div>
      <div class="bar-row"><div class="name">기본요금</div><div class="bar-track"><div class="bar-fill bf-green" style="width:100%">−30.5%</div></div></div>
      <div class="bar-row"><div class="name">방문요금</div><div class="bar-track"><div class="bar-fill bf-red out" style="width:23.3%"><span>−7.1%</span></div></div></div>
    </div>
  </div>
</div>
</div></body></html>
