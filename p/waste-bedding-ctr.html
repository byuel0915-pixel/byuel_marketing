<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>폐기물 '이불' 소구 — CTR | 박성진</title>
<meta name="description" content="폐기물 이불 소구의 CTR을 네 개 비교군과 대조">
<link rel="stylesheet" href="../assets/style.css">
<style>
  .wrap{padding:14px 16px}
  .ct{display:flex;align-items:baseline;gap:9px;margin-bottom:13px}
  .ct h3{margin:0;font-size:15px;font-weight:800;letter-spacing:-.015em}
  .ct .dir{font-size:11.5px;font-weight:700;color:var(--ink-3)}
  .bar-row{grid-template-columns:118px 1fr;gap:12px;margin:10px 0}
  .bar-row .name{font-size:12.5px}
  .bar-track{height:33px}
  .goal{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed #5A6172;z-index:3}
  .goal span{position:absolute;top:50%;transform:translateY(-50%);left:6px;font-size:10.5px;font-weight:800;color:#5A6172;white-space:nowrap}
  .note{margin-top:11px}
  @media(max-width:520px){.bar-row{grid-template-columns:92px 1fr;gap:8px}.bar-row .name{font-size:11px}}
</style>
</head><body><div class="wrap">
<div class="card pad chart">
  <div class="ct"><h3>CTR</h3><span class="dir">높을수록 좋음 · 매체 기준</span></div>
  <div class="bar-row"><div class="name">폐기물(이불)</div><div class="bar-track"><div class="bar-fill bf-green" style="width:100%">1.34%</div></div></div>
  <div class="bar-row"><div class="name">같은 세트 3종</div><div class="bar-track"><div class="bar-fill bf-gray" style="width:63.4%">0.85%</div></div></div>
  <div class="bar-row"><div class="name">여름 세트 3종</div><div class="bar-track"><div class="bar-fill bf-gray" style="width:50.0%">0.67%</div></div></div>
  <div class="bar-row"><div class="name">동일 기간 평균</div><div class="bar-track"><div class="bar-fill bf-blue" style="width:48.5%">0.65%</div></div></div>
  <div class="bar-row"><div class="name">이전 폐기물 소구</div><div class="bar-track">
    <div class="bar-fill bf-red" style="width:25.4%">0.34%</div>
    <div class="goal" style="left:38.1%"><span>목표 0.51% (1.5배)</span></div>
  </div></div>
  <p class="note">이전 폐기물 소구 대비 <b>3.94배</b>, 동일 기간 평균 대비 <b>2.06배</b>. 목표 1.5배를 두 기준선 모두에서 넘겼습니다. <a href="waste-bedding.html" style="font-weight:700;color:var(--blue);text-decoration:none">전체 데이터 →</a></p>
</div>
</div></body></html>
